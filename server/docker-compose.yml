# Backend behind Caddy, which obtains and renews the HTTPS certificate automatically.
# Set BACKEND_DOMAIN and the values in .env first. See docs/web/DEPLOYMENT.md.
services:
  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TRUST_PROXY: "true"
      PUBLIC_BASE_URL: "https://${BACKEND_DOMAIN:?Set BACKEND_DOMAIN in .env}"
    volumes:
      - cache:/data/cache
      - config:/data/config
    # No ports are published: only Caddy talks to the backend. If you turn torrents on, also publish
    # TORRENT_PORT here (tcp and udp) and open it in your firewall, which helps poorly seeded swarms.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 4g
    pids_limit: 512

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    environment:
      BACKEND_DOMAIN: ${BACKEND_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  cache:
  config:
  caddy-data:
